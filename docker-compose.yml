name: fleetledger

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fleetledger
      POSTGRES_USER: fleetledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetledger -d fleetledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./fleetledger-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: Host=postgres;Port=5432;Database=fleetledger;Username=fleetledger;Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY no .env (veja .env.example)}
      AdministratorSeed__OrganizationName: ${ADMIN_ORGANIZATION_NAME:?defina ADMIN_ORGANIZATION_NAME no .env (veja .env.example)}
      AdministratorSeed__Email: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env (veja .env.example)}
      AdministratorSeed__Password: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env (veja .env.example)}
    ports:
      - "${API_PORT:-5080}:8080"

  backoffice-web:
    build: ./fleetledger-backoffice-web
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres-data:
